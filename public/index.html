<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL Shortener & Click Analytics — Rana Yasir Mahy Ud Din</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between font-sans">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/60 backdrop-blur sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <div class="bg-indigo-600 text-white font-bold px-3 py-1.5 rounded-xl shadow-lg">US</div>
        <span class="text-lg font-bold tracking-wider">LinkMetrics Engine</span>
      </div>
      <div class="text-xs text-slate-400">
        Developer: <span class="text-indigo-400 font-medium">Rana Yasir Mahy Ud Din</span>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-6xl mx-auto px-6 py-10 flex-grow w-full">
    <div class="text-center mb-10">
      <h1 class="text-3xl font-extrabold tracking-tight mb-2">High-Speed URL Shortener</h1>
      <p class="text-slate-400 text-sm max-w-lg mx-auto">Create short links, track real-time click analytics, and monitor visitor traffic effortlessly.</p>
    </div>

    <!-- Shortener Card -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl mb-10 max-w-2xl mx-auto">
      <form id="shorten-form" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase tracking-wider">Destination Long URL</label>
          <input type="url" id="long-url" required placeholder="https://example.com/very-long-url-path" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase tracking-wider">Custom Alias (Optional)</label>
          <input type="text" id="custom-code" placeholder="e.g. my-brand" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500">
        </div>
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 rounded-xl transition-all shadow-lg shadow-indigo-600/20">
          Generate Short Link
        </button>
      </form>
      <div id="msg" class="mt-3 text-xs text-center hidden"></div>
    </div>

    <!-- URLs Table Directory -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
      <h2 class="text-lg font-bold mb-4 border-b border-slate-800 pb-3">Active Short Links & Analytics</h2>
      <div id="urls-list" class="space-y-3">
        <!-- Populated dynamically -->
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="border-t border-slate-800 bg-slate-900/40 py-6 text-center text-xs text-slate-500">
    © 2026 Rana Yasir Mahy Ud Din • URL Shortener & Analytics Engine
  </footer>

  <script>
    const baseUrl = window.location.origin;

    async function fetchUrls() {
      try {
        const res = await fetch('/api/urls');
        const json = await res.json();
        if (json.success) {
          renderUrls(json.data);
        }
      } catch (err) {
        console.error('Error fetching URLs:', err);
      }
    }

    function renderUrls(urls) {
      const list = document.getElementById('urls-list');
      if (urls.length === 0) {
        list.innerHTML = `<p class="text-xs text-slate-500 text-center py-4">No short links created yet.</p>`;
        return;
      }

      list.innerHTML = urls.map(u => `
        <div class="p-4 bg-slate-950/60 rounded-xl border border-slate-800 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 text-sm">
          <div class="overflow-hidden pr-2">
            <div class="flex items-center space-x-2 mb-1">
              <a href="/${u.shortCode}" target="_blank" class="font-bold text-indigo-400 hover:underline text-sm">${baseUrl}/${u.shortCode}</a>
              <span class="text-[10px] bg-indigo-500/10 text-indigo-300 px-2 py-0.5 rounded font-semibold">${u.clicks} Clicks</span>
            </div>
            <p class="text-slate-400 text-xs truncate max-w-md">Target: <a href="${u.longUrl}" target="_blank" class="hover:underline text-slate-300">${u.longUrl}</a></p>
          </div>
          <div class="flex items-center space-x-2 flex-shrink-0 w-full md:w-auto justify-end">
            <button onclick="navigator.clipboard.writeText('${baseUrl}/${u.shortCode}'); alert('Short link copied to clipboard!');" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs px-3 py-1.5 rounded-lg font-medium transition-all">Copy</button>
            <button onclick="deleteUrl(${u.id})" class="bg-red-500/10 hover:bg-red-500/20 text-red-400 text-xs px-3 py-1.5 rounded-lg font-medium transition-all">Delete</button>
          </div>
        </div>
      `).join('');
    }

    document.getElementById('shorten-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const longUrl = document.getElementById('long-url').value;
      const customCode = document.getElementById('custom-code').value;
      const msg = document.getElementById('msg');

      try {
        const res = await fetch('/api/shorten', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ longUrl, customCode })
        });
        const json = await res.json();

        if (json.success) {
          msg.innerText = '✅ Short link created successfully!';
          msg.classList.remove('hidden', 'text-red-400');
          msg.classList.add('text-emerald-400');
          document.getElementById('long-url').value = '';
          document.getElementById('custom-code').value = '';
          fetchUrls();
        } else {
          msg.innerText = '❌ ' + json.message;
          msg.classList.remove('hidden', 'text-emerald-400');
          msg.classList.add('text-red-400');
        }
      } catch (err) {
        msg.innerText = '❌ Failed to create short link.';
        msg.classList.remove('hidden', 'text-emerald-400');
        msg.classList.add('text-red-400');
      }
    });

    async function deleteUrl(id) {
      if (!confirm('Are you sure you want to delete this short link?')) return;
      try {
        const res = await fetch(`/api/urls/${id}`, { method: 'DELETE' });
        const json = await res.json();
        if (json.success) {
          fetchUrls();
        } else {
          alert(json.message);
        }
      } catch (err) {
        alert('Failed to delete URL.');
      }
    }

    fetchUrls();
  </script>
</body>
</html>
